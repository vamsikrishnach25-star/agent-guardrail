# One-command demo: docker-compose up --build
#
# Runs the real production stack - Postgres instead of the SQLite fallback
# used for zero-setup local dev (see backend/app/database.py) - so this is
# also how you'd sanity-check the app against Postgres before deploying.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    ports:
      - "5432:5432"
    volumes:
      - guardrail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://guardrail:guardrail@postgres:5432/guardrail
      # Week 6: set a real value for anything beyond local docker-compose -
      # this default is fine for a throwaway local Postgres instance only.
      GUARDRAIL_JWT_SECRET: local-docker-compose-secret-not-for-real-use
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  guardrail_pgdata:
